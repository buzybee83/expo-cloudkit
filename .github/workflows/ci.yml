name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

  swift-tests:
    name: Swift XCTest (iOS Simulator)
    runs-on: macos-15
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install root dependencies and build plugin
        run: npm ci && npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm install --legacy-peer-deps

      - name: Prebuild Expo project (generate ios/)
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      # Inject the module's Swift test files into the generated Xcode test target.
      # The xcodeproj gem adds each .swift file in ios/Tests/ to the test target so
      # that xcodebuild compiles them with @testable import ExpoCloudKit access.
      # The resolved target name is written to /tmp/swift_test_target for the run step.
      - name: Inject Swift test sources into Xcode test target
        run: |
          gem install xcodeproj --no-document --quiet
          ruby - <<'RUBY'
          require 'xcodeproj'

          PROJECT_PATH = 'example/ios/ExpoCloudKitExample.xcodeproj'
          TESTS_DIR = File.expand_path('ios/Tests')

          project = Xcodeproj::Project.open(PROJECT_PATH)

          puts "Available targets: #{project.targets.map(&:name).join(', ')}"

          # Find any existing unit test target, or use the first one ending in 'Tests'
          test_target = project.targets.find { |t| t.name.end_with?('Tests') && t.test_target_type? rescue false }
          test_target ||= project.targets.find { |t| t.name.end_with?('Tests') }

          created_new_target = false
          if test_target.nil?
            # Create a new unit test target (unique name avoids collisions with pod test products)
            puts "No test target found — creating ExpoCloudKitCITests"
            app_target = project.targets.find { |t| !t.name.end_with?('Tests') }
            test_target = project.new_target(:unit_test_bundle, 'ExpoCloudKitCITests', :ios, '16.0')
            test_target.add_dependency(app_target) if app_target
            # Set required build settings for the synthesised target.
            # TEST_HOST / BUNDLE_LOADER make this a hosted unit test bundle: the
            # test bundle is loaded into the app binary at test time, so
            # @testable import ExpoCloudKit resolves from the app's linked modules.
            app_name = app_target ? app_target.name : 'ExpoCloudKitExample'
            test_target.build_configurations.each do |config|
              config.build_settings['SWIFT_VERSION'] = '5.0'
              config.build_settings['GENERATE_INFOPLIST_FILE'] = 'YES'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['PRODUCT_NAME'] = 'ExpoCloudKitCITests'
              config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.expo.ExpoCloudKitCITests'
              config.build_settings['TEST_HOST'] = "$(BUILT_PRODUCTS_DIR)/#{app_name}.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/#{app_name}"
              config.build_settings['BUNDLE_LOADER'] = '$(TEST_HOST)'
            end
            created_new_target = true
          else
            puts "Using test target: #{test_target.name}"
          end

          # Write the resolved target name so the run step can use it without re-parsing
          File.write('/tmp/swift_test_target', test_target.name)

          # If we created a new target, add it to the scheme's Test action so
          # xcodebuild -only-testing:ExpoCloudKitTests can find it.
          if created_new_target
            scheme_dir = Xcodeproj::XCScheme.shared_data_dir(PROJECT_PATH)
            scheme_file = File.join(scheme_dir, 'ExpoCloudKitExample.xcscheme')
            if File.exist?(scheme_file)
              require 'rexml/document'
              doc = REXML::Document.new(File.read(scheme_file))
              testables = doc.elements['//TestAction/Testables']
              if testables
                ref = REXML::Element.new('TestableReference')
                ref.attributes['skipped'] = 'NO'
                br = REXML::Element.new('BuildableReference')
                br.attributes['BuildableIdentifier'] = 'primary'
                br.attributes['BlueprintIdentifier'] = test_target.uuid
                br.attributes['BuildableName'] = "ExpoCloudKitCITests.xctest"
                br.attributes['BlueprintName'] = test_target.name
                br.attributes['ReferencedContainer'] = "container:#{File.basename(PROJECT_PATH)}"
                ref.add_element(br)
                testables.add_element(ref)
                File.write(scheme_file, doc.to_s)
                puts "Added #{test_target.name} to scheme Test action"
              else
                puts "WARNING: Could not find Testables element in scheme"
              end
            else
              puts "WARNING: Scheme file not found at #{scheme_file}"
            end
          end

          # Find or create a group for the injected test sources (named after the target)
          group = project.main_group.find_subpath(test_target.name, true)
          group.set_path(TESTS_DIR)

          swift_files = Dir.glob(File.join(TESTS_DIR, '*.swift'))
          raise 'No Swift files found in ios/Tests/' if swift_files.empty?

          swift_files.each do |file_path|
            file_ref = group.new_file(file_path)
            test_target.source_build_phase.add_file_reference(file_ref)
            puts "Added: #{File.basename(file_path)}"
          end

          project.save
          puts "Saved #{PROJECT_PATH} — test target: #{test_target.name}"
          RUBY

      # 1. Add an ExpoCloudKitCITests pod target with inherit! :search_paths.
      #    The app target has ExpoCloudKit via Expo auto-linking from node_modules.
      #    inherit! :search_paths propagates the framework search paths + module
      #    maps to the test bundle so @testable import ExpoCloudKit resolves.
      #    We do NOT re-declare the pod (CocoaPods rejects duplicate sources).
      # 2. Inject ENABLE_TESTABILITY into the existing post_install block so
      #    the ExpoCloudKit pod is compiled with testing enabled.
      # CocoaPods disallows multiple post_install blocks, so we insert into the first one.
      - name: Patch Podfile for testability
        working-directory: example/ios
        run: |
          ruby - <<'RUBY'
          content = File.read('Podfile')

          # Declare a test target. The app target already has ExpoCloudKit
          # linked via Expo auto-linking (from ../node_modules/expo-cloudkit).
          # inherit! :search_paths propagates that linkage to the test bundle
          # so @testable import ExpoCloudKit resolves without re-declaring the pod
          # (which would cause a 'multiple sources' conflict).
          test_target_block = <<~PODFILE_BLOCK

          target 'ExpoCloudKitCITests' do
            inherit! :search_paths
          end
          PODFILE_BLOCK

          # Insert before post_install (or append to end of file)
          if content.include?('post_install do |installer|')
            content.sub!("post_install do |installer|", "#{test_target_block}\npost_install do |installer|")
          else
            content += test_target_block
          end

          # Inject ENABLE_TESTABILITY so @testable import compiles.
          inject = "  installer.pods_project.targets.select { |t| t.name == 'ExpoCloudKit' }.each do |t|\n    t.build_configurations.each { |c| c.build_settings['ENABLE_TESTABILITY'] = 'YES' }\n  end\n"
          content.sub!("post_install do |installer|\n", "post_install do |installer|\n#{inject}")

          File.write('Podfile', content)
          puts 'Patched Podfile: added ExpoCloudKitCITests target with pod ExpoCloudKit :path + ENABLE_TESTABILITY'
          RUBY

      - name: Cache CocoaPods downloads
        uses: actions/cache@v5
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install --repo-update

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      - name: Run Swift tests
        working-directory: example/ios
        run: |
          set -o pipefail
          TEST_TARGET=$(cat /tmp/swift_test_target 2>/dev/null || echo 'ExpoCloudKitExampleTests')
          echo "Running test target: $TEST_TARGET"
          xcodebuild test \
            -workspace ExpoCloudKitExample.xcworkspace \
            -scheme ExpoCloudKitExample \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -only-testing:"$TEST_TARGET" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty --color
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "--- xcodebuild failed (exit $EXIT) — last 200 lines of raw log ---"
            tail -200 /tmp/xcodebuild.log
            exit "$EXIT"
          fi
