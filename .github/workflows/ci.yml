name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

  swift-tests:
    name: Swift XCTest (iOS Simulator)
    runs-on: macos-14
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies and build plugin
        run: npm ci && npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm install --legacy-peer-deps

      - name: Prebuild Expo project (generate ios/)
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      # Inject the module's Swift test files into the generated Xcode test target.
      # The xcodeproj gem adds each .swift file in ios/Tests/ to the test target so
      # that xcodebuild compiles them with @testable import ExpoCloudKit access.
      # The resolved target name is written to /tmp/swift_test_target for the run step.
      - name: Inject Swift test sources into Xcode test target
        run: |
          gem install xcodeproj --no-document --quiet
          ruby - <<'RUBY'
          require 'xcodeproj'

          PROJECT_PATH = 'example/ios/ExpoCloudKitExample.xcodeproj'
          TESTS_DIR = File.expand_path('ios/Tests')

          project = Xcodeproj::Project.open(PROJECT_PATH)

          puts "Available targets: #{project.targets.map(&:name).join(', ')}"

          # Find any existing unit test target, or use the first one ending in 'Tests'
          test_target = project.targets.find { |t| t.name.end_with?('Tests') && t.test_target_type? rescue false }
          test_target ||= project.targets.find { |t| t.name.end_with?('Tests') }

          if test_target.nil?
            # Create a new unit test target
            puts "No test target found — creating ExpoCloudKitTests"
            app_target = project.targets.find { |t| !t.name.end_with?('Tests') }
            test_target = project.new_target(:unit_test_bundle, 'ExpoCloudKitTests', :ios, '16.0')
            test_target.add_dependency(app_target) if app_target
          else
            puts "Using test target: #{test_target.name}"
          end

          # Write the resolved target name so the run step can use it without re-parsing
          File.write('/tmp/swift_test_target', test_target.name)

          # Find or create a group for the injected test sources (named after the target)
          group = project.main_group.find_subpath(test_target.name, true)
          group.set_path(TESTS_DIR)

          swift_files = Dir.glob(File.join(TESTS_DIR, '*.swift'))
          raise 'No Swift files found in ios/Tests/' if swift_files.empty?

          swift_files.each do |file_path|
            file_ref = group.new_file(file_path)
            test_target.source_build_phase.add_file_reference(file_ref)
            puts "Added: #{File.basename(file_path)}"
          end

          project.save
          puts "Saved #{PROJECT_PATH} — test target: #{test_target.name}"
          RUBY

      # Inject ENABLE_TESTABILITY into the existing post_install block in the
      # Expo-generated Podfile so @testable import ExpoCloudKit compiles in tests.
      # CocoaPods disallows multiple post_install blocks, so we insert into the first one.
      - name: Patch Podfile for testability
        working-directory: example/ios
        run: |
          ruby - <<'RUBY'
          content = File.read('Podfile')
          inject = "  installer.pods_project.targets.select { |t| t.name == 'ExpoCloudKit' }.each do |t|\n    t.build_configurations.each { |c| c.build_settings['ENABLE_TESTABILITY'] = 'YES' }\n  end\n"
          raise 'No post_install block found in Podfile' unless content.include?('post_install do |installer|')
          content.sub!("post_install do |installer|\n", "post_install do |installer|\n#{inject}")
          File.write('Podfile', content)
          puts 'Patched Podfile for ENABLE_TESTABILITY'
          RUBY

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install --repo-update

      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      - name: Run Swift tests
        working-directory: example/ios
        run: |
          set -o pipefail
          TEST_TARGET=$(cat /tmp/swift_test_target 2>/dev/null || echo 'ExpoCloudKitExampleTests')
          echo "Running test target: $TEST_TARGET"
          xcodebuild test \
            -workspace ExpoCloudKitExample.xcworkspace \
            -scheme ExpoCloudKitExample \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro,OS=latest" \
            -only-testing:"$TEST_TARGET" \
            2>&1 | tee /tmp/xcodebuild.log | xcpretty --color
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "--- xcodebuild failed (exit $EXIT) — last 100 lines of raw log ---"
            tail -100 /tmp/xcodebuild.log
            exit "$EXIT"
          fi
